- navigation "Điều hướng chính":
  - img "Logo Phin Cà Phê"
  - button "Sơ đồ bàn"
  - button "Cài đặt"
- banner:
  - text: Cài đặt cửa hàng QA Owner a Chủ cửa hàng
  - button "Đăng xuất"
- main:
  - region "Cài đặt tổ chức":
    - heading "Cài đặt cửa hàng" [level=1]
    - paragraph: Quản lý chi nhánh, bàn và tài khoản nhân viên.
    - tablist "Cài đặt":
      - tab "Chi nhánh"
      - tab "Bàn" [selected]
      - tab "Tài khoản"
    - text: Chi nhánh
    - combobox "Chi nhánh":
      - option "Tất cả chi nhánh"
      - option "QA Vườn (Ngưng hoạt động)" [selected]
      - option "QA Phố mới"
    - text: Trạng thái
    - combobox "Trạng thái":
      - option "Tất cả trạng thái" [selected]
      - option "Hoạt động"
      - option "Ngưng hoạt động"
    - button "Thêm bàn"
    - table:
      - rowgroup:
        - row "Tên Chi nhánh Khu vực Số chỗ Trạng thái Thao tác":
          - columnheader "Tên"
          - columnheader "Chi nhánh"
          - columnheader "Khu vực"
          - columnheader "Số chỗ"
          - columnheader "Trạng thái"
          - columnheader "Thao tác"
      - rowgroup:
        - row "QA Bàn đã sửa QA Vườn — Chưa xác định Ngưng hoạt động Sửa Mở lại":
          - cell "QA Bàn đã sửa":
            - strong: QA Bàn đã sửa
          - cell "QA Vườn"
          - cell "—"
          - cell "Chưa xác định"
          - cell "Ngưng hoạt động"
          - cell "Sửa Mở lại":
            - button "Sửa"
            - button "Mở lại"
        - row "QA Bàn QA Vườn — Chưa xác định Hoạt động Sửa Ngưng dùng":
          - cell "QA Bàn":
            - strong: QA Bàn
          - cell "QA Vườn"
          - cell "—"
          - cell "Chưa xác định"
          - cell "Hoạt động"
          - cell "Sửa Ngưng dùng":
            - button "Sửa"
            - button "Ngưng dùng"
    - button "Trang trước" [disabled]
    - text: Trang 1 · 2 bản ghi
    - button "Trang sau" [disabled]
    - dialog "Xác nhận thay đổi":
      - heading "Xác nhận thay đổi" [level=2]
      - button "Đóng hộp thoại"
      - paragraph: Mở lại QA Bàn đã sửa?
      - button "Hủy"
      - button "Xác nhận"
