- navigation "Điều hướng chính":
  - img "Logo Phin Cà Phê"
  - button "Sơ đồ bàn"
  - button "Cài đặt"
- banner:
  - text: Cài đặt cửa hàng QA Owner a Chủ chuỗi
  - button "Đăng xuất"
- main:
  - region "Cài đặt tổ chức":
    - heading "Cài đặt cửa hàng" [level=1]
    - paragraph: Quản lý chi nhánh, bàn và tài khoản nhân viên.
    - tablist "Cài đặt":
      - tab "Chi nhánh" [selected]
      - tab "Bàn"
      - tab "Tài khoản"
    - text: Trạng thái
    - combobox "Trạng thái":
      - option "Tất cả trạng thái" [selected]
      - option "Hoạt động"
      - option "Ngưng hoạt động"
    - button "Thêm chi nhánh"
    - table:
      - rowgroup:
        - row "Mã Tên Địa chỉ Điện thoại Quỹ tiền ban đầu Trạng thái Thao tác":
          - columnheader "Mã"
          - columnheader "Tên"
          - columnheader "Địa chỉ"
          - columnheader "Điện thoại"
          - columnheader "Quỹ tiền ban đầu"
          - columnheader "Trạng thái"
          - columnheader "Thao tác"
      - rowgroup:
        - row "aA QA Phố QA Địa chỉ 0900000000 1.000.000.000.000đ Hoạt động Sửa Ngưng dùng":
          - cell "aA"
          - cell "QA Phố":
            - strong: QA Phố
          - cell "QA Địa chỉ"
          - cell "0900000000"
          - cell "1.000.000.000.000đ"
          - cell "Hoạt động"
          - cell "Sửa Ngưng dùng":
            - button "Sửa"
            - button "Ngưng dùng"
    - button "Trang trước" [disabled]
    - text: Trang 1 · 1 bản ghi
    - button "Trang sau" [disabled]
- status:
  - text: Đã lưu thay đổi.
  - button "Đóng thông báo"